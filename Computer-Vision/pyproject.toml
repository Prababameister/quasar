[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadruped-webcam-vision"
version = "0.1.0"
description = "Webcam calibration and AprilTag-relative camera pose tracking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-contrib-python>=4.8,<5"]

[project.scripts]
webcam-vision = "webcam_vision.cli:main"

[tool.setuptools.packages.find]
include = ["webcam_vision*"]
