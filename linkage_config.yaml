# Linkage Configuration
# ─────────────────────
# end_effector: name of the point treated as the IK target (default: D)
end_effector: D

# hip_fixed_deg: constant hip angle used for every leg until hip IK exists.
hip_fixed_deg: 90.0
hip_swing_max_deg: 30
# hip_offset_mm: sideways distance from the hip servo's rotation axis to the
# leg's plane (the thigh pivot), measured on the robot.
hip_offset_mm: 41.0

# legs: the quadruped's four legs. The points/edges/inputs block below is the
# canonical LEFT-leg geometry, used AS-IS for every leg: a given foot target
# (x, y) solves to the same theta1/theta_c on the left and right. A right leg
# is physically built and wired as a mirror image, so commanding it the same
# canonical angle produces the correct mirrored motion; the UI mirrors its
# drawing for display only. Use `offsets` below to trim each servo's zero and
# take up any residual left/right rotation-direction difference.
#
#   side        : left | right
#   channels    : PCA9685 channel (0-11) driving each servo of this leg
#   offsets     : per-servo angle offset in degrees, ADDED to the IK angle
#                 before conversion to microseconds. Use these to zero each
#                 servo and to take up the rotation-direction difference on
#                 right legs.
#                 Example: physical 0° of the thigh servo = linkage -55° -> -55.0
#   calibration : per-servo angle -> microsecond mapping, given as two
#                 reference points (deg0, us0) and (deg1, us1). Each physical
#                 servo has its own pulse-width response, so this is a
#                 straight-line fit PER SERVO rather than one shared range.
#                 deg0/deg1 are two IK-facing joint angles — us0/us1 are
#                 whatever microsecond pulse actually drives THAT servo to
#                 those two angles. To calibrate a servo: use /serial/send_raw
#                 (or the send_raw command) to sweep its pulse width, note the
#                 microseconds at which it reaches deg0 and deg1, and enter
#                 those pairs here. Default below (500/2500 at the existing
#                 joint range) reproduces the old fixed-range behavior until
#                 you calibrate a given servo.
#
# Edit `channels` to match your wiring. Run POST /config/reload (or click
# Reload Config) to apply changes without restarting.
#
# calibration_frame: which angle frame the deg0/deg1 values below are written in.
#   hardware : the convention the servos were calibrated in (current).
#              Seen from the side, with the linkage drawn as in `points` below:
#                theta1  key = HORN  servo: 0 = level, pointing LEFT,  90 = pointing up
#                theta_c key = THIGH servo: 0 = level, pointing RIGHT, 90 = straight down
#                                           (theta1 zero and theta_c zero are 180 deg apart)
#                hip         = 90 = leg hanging straight down, 0 = leg horizontal,
#                              swung out sideways
#              Left/right = looking at the leg from ITS OWN outside; which of
#              those is the robot's front is the leg's x_forward_sign.
#              The software converts solver angles to this frame just before
#              the angle -> us step (serial_manager.compute_leg_us), and
#              `offsets` are applied in this frame.
#   solver   : raw linkage-solver angles (the old calibration format).
calibration_frame: hardware

# x_forward_sign (per leg, below): which way the linkage's +x (the direction
# the thigh points at theta_c = 0) faces on the real robot for THAT leg.
# +1 = robot front, -1 = robot back. Set from robot tests on 2026-11-05:
# left legs +1, right legs -1. NOTE: all four knees physically point forward,
# and the knee points toward +x in this geometry, which predicts +1 for every
# leg; the right legs needing -1 suggests their calibration is mirrored.
# ik_interactive.py takes X as robot-forward for every leg.
# (gait.py does NOT use this yet.)
legs:
  FL:
    side: left
    x_forward_sign: +1  # flipped 2026-11-05 after robot test (was -1)
    hip_dir: -1        # was +1, but the foot moved inward on all legs (2026-11-05); flip back if it now moves inward
    channels: {theta1: 1,  theta_c: 0,  hip: 2}
    offsets:  {theta1_deg: 0.0, thetac_deg: 0.0, hip_deg: 0.0}
    calibration:
      theta1:  {deg0: 0.0,  us0: 1140, deg1: 90.0, us1: 500}
      theta_c: {deg0: 0.0, us0: 1120, deg1: 90.0, us1: 500}
      hip:     {deg0: 0.0,   us0: 1850, deg1: 90.0, us1: 1200}
  BL:
    side: left
    x_forward_sign: +1  # flipped 2026-11-05 after robot test (was -1)
    hip_dir: -1        # was +1, but the foot moved inward on all legs (2026-11-05); flip back if it now moves inward
    channels: {theta1: 4,  theta_c: 3,  hip: 5}
    offsets:  {theta1_deg: 0.0, thetac_deg: 0.0, hip_deg: 0.0}
    calibration:
      theta1:  {deg0: 0.0,  us0: 1250, deg1: 90.0, us1: 600}
      theta_c: {deg0: 0.0, us0: 1150, deg1: 90.0, us1: 520}
      hip:     {deg0: 0.0,   us0: 1800, deg1: 90.0, us1: 1150}
  BR:
    side: right
    x_forward_sign: -1  # flipped 2026-11-05 after robot test (was +1)
    hip_dir: -1        # was +1, but the foot moved inward on all legs (2026-11-05); flip back if it now moves inward
    channels: {theta1: 7,  theta_c: 6,  hip: 8}
    offsets:  {theta1_deg: 0.0, thetac_deg: 0.0, hip_deg: 0.0}
    calibration:
      theta1:  {deg0: 0,  us0: 1500, deg1: 90, us1: 2140}
      theta_c: {deg0: 0, us0: 1580, deg1: 90, us1: 2240}
      hip:     {deg0: 0,   us0: 580, deg1: 90, us1: 1220}
  FR:
    side: right
    x_forward_sign: -1  # flipped 2026-11-05 after robot test (was +1)
    hip_dir: -1        # was +1, but the foot moved inward on all legs (2026-11-05); flip back if it now moves inward
    channels: {theta1: 10, theta_c: 9,  hip: 11}
    offsets:  {theta1_deg: 0.0, thetac_deg: 0.0, hip_deg: 0.0}
    calibration:
      theta1:  {deg0: 90.0,  us0: 1970, deg1: 0.0, us1: 1260}
      theta_c: {deg0: 90.0,  us0: 2330,  deg1: 0.0, us1: 1720}
      hip:     {deg0: 0.0,   us0: 550,  deg1: 90.0, us1: 1200}

# gait: diagonal-trot walking driven by a hand-placed foot path. `waypoints` is
# a closed loop of [x, y] points in the canonical left-leg frame (D.x forward,
# D.y up), recorded via the "Record" button in the IK UI and saved with
# "Save Path" (which rewrites just this list in-place). One gait cycle walks
# the loop start -> ... -> last -> back to start, spending an equal fraction
# of the cycle on each segment, linearly interpolating the foot position
# within it. The same loop drives every leg with a half-cycle phase offset
# between the two diagonal pairs. Direction 0 (stopped) parks the foot at
# waypoints[0].
gait:
  cycle_time_s:     1.2     # duration of one full loop
  update_rate_hz:   30      # servo command rate while walking
  forward_axis_sign: 1      # +1 if the recorded loop order is robot-forward; flip if it walks backward
  waypoints:                # canonical-frame [x, y] loop, in mm (must be reachable)
    - [14.818, -170.029]
    - [10.629, -150.203]
    - [-1.939, -138.105]
    - [-21.489, -150.203]
    - [-25.678, -167.486]
  lateral_scale: 1.0   # mm of sideways foot travel per mm of recorded x travel
  strafe_sign: 1       # flip to -1 if strafing goes the wrong way

# jump: a straight-up jump, all four legs in phase. Points are canonical-frame
# [x, y] foot targets in mm (must be reachable), set via the Jump controls in
# the UI. Keep x the same for all three so the push is vertical.
#   neutral : pose the jump starts from and lands in
#   crouch  : loaded pose; the foot is eased neutral -> crouch over crouch_time_s
#   extend  : launch pose; commanded as a single step so the servos run at full
#             speed rather than at the interpolation rate
# After the extend command the legs hold for extend_hold_s (roughly the time
# to leave the ground), then are commanded straight back to neutral so they are
# in position before touchdown. Timing is open-loop: tune these on the robot.
jump:
  neutral: [-5.0, -150.0]
  crouch:  [-5.0, -110.0]
  extend:  [-5.0, -170.0]
  crouch_time_s: 0.5
  extend_hold_s: 0.15

# viewport: canvas bounds in mm (adjust to fit your mechanism)
viewport:
  xmin: -50
  xmax: 250
  ymin: -200
  ymax: 150

# ik_config: gradient descent IK tuning
ik_config:
  tolerance_mm:   1.0      # stop when |error| < this
  max_iterations: 2000
  learning_rate:  1.0      # initial step size in degrees
  finite_diff_h:  0.01     # perturbation for numerical gradient (degrees)

# workspace_config: precomputation settings
workspace_config:
  step_deg: 2.0            # angular step size for workspace sweep

points:
  O:
    x: 0.0
    y: 0.0
    fixed: true
  Q:
    x: 23.0
    y: 25.0
    fixed: true
  A:
    x: 17.87
    y: 17.87
  B:
    x: 30.0
    y: 40.0
  C:
    x: 200.0
    y: -80.0
  P1:
    x: 90.0
    y: 50.0
  P2:
    x: 110.0
    y: 20.0
  D:
    x: 200.0
    y: -80.0

edges:
  - from: O
    to: A
    length: 25.298
  - from: Q
    to: B
    length: 27.093
  - from: A
    to: B
    length: 31.955
  - from: Q
    to: P1
    length: 113.748    # thigh (measured)
  - from: Q
    to: C
    length: 31.607
  - from: C
    to: P2
    length: 113.748    # knee rod, parallel to and same length as the thigh
  - from: P1
    to: P2
    length: 31.305
  - from: P1
    to: D
    length: 137.733    # shin (measured)

inputs:
  - name: theta1
    pivot: O
    point: A
    angle_deg: 45.0
    min_deg: 90.0
    max_deg: 360.0
  - name: theta_c
    pivot: Q
    point: P1
    angle_deg: -30.0
    min_deg: -90.0
    max_deg: 180.0

angle_constraints:
  - edge1: [B, Q]
    edge2: [Q, C]
    angle_deg: 90.0
