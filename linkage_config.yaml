# Linkage Configuration
# ─────────────────────
# points:
#   x, y       optional — omit or leave out for free joints (defaults to 0.0)
#              For fixed points, x and y must be set.
#   fixed      true = ground pivot, never moves
#
# edges:
#   from/to    point names
#   length     rigid link length in mm
#
# inputs:
#   name       slider label
#   pivot      fixed end of the driven link (must be a fixed point)
#   point      the end that moves when you drag the slider
#   angle_deg  starting angle in degrees (world frame)
#
# angle_constraints — two forms:
#
#   Fixed angle from world +X axis:
#     edge: [A, B]       the link whose angle is constrained
#     angle_deg: 45.0    angle of A→B from horizontal
#
#   Relative angle between two edges sharing a point:
#     edge1: [A, B]
#     edge2: [A, C]      both edges must share point A
#     angle_deg: 60.0    angle from edge1 to edge2

points:
  O:
    x: 0.0
    y: 0.0
    fixed: true

  Q:
    x: 23.0
    y: 25.0
    fixed: true

  A:              # x/y are initial-guess hints for the solver
    x: 17.87
    y: 17.87

  B:
    x: 30.0
    y: 40.0

  C:
    x: 200.0
    y: -80.0

  D:
    x: 40.0
    y: -110.0

  P1:
    x: 90.0
    y: 50.0

  P2:             # no x/y — solver will figure it out from constraints
    x: 110.0
    y: 20.0


edges:
  - from: O
    to: A
    length: 25.298

  - from: Q
    to: B
    length: 27.093

  - from: A
    to: B
    length: 31.955

  - from: Q
    to: P1
    length: 113.748

  - from: Q
    to: C
    length: 31.607

  - from: C
    to: P2
    length: 113.748

  - from: P1
    to: P2
    length: 31.305

  - from: P1
    to: D
    length: 137.733

inputs:
  - name: theta1
    pivot: O
    point: A
    angle_deg: 90.0

  - name: theta_c
    pivot: Q
    point: P1
    angle_deg: -30.0

angle_constraints:
  - edge1: [B, Q]
    edge2: [Q, C]
    angle_deg: 90.0

  # Example 2 — fix the A→B link at 90 degrees from world horizontal
  # (uncomment to use — will conflict with the inputs above if over-constrained)
  # - edge: [A, B]
  #   angle_deg: 90.0
