<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadruped Leg Test Utility</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Quadruped Leg Test Utility</h1>
    <div class="header-controls">
      <span id="status-msg" class="status-msg"></span>
      <button id="btn-reload" class="btn">↺ Reload Config</button>
    </div>
  </header>

  <div id="control-bar">
    <!-- Serial -->
    <div class="ctl-group">
      <span class="ctl-label">Hardware</span>
      <div class="hw-port-row">
        <select id="hw-port-select"><option value="">— select port —</option></select>
        <button class="btn" id="hw-refresh" title="Refresh port list">↺</button>
      </div>
      <button class="btn btn-hw-connect" id="hw-connect">Connect</button>
      <span id="hw-serial-status" class="hw-status disconnected">⬤ Disconnected</span>
    </div>

    <!-- Walk -->
    <div class="ctl-group">
      <span class="ctl-label">Walk <span class="hint">(hold ↑ ↓ ← →)</span></span>
      <button class="btn btn-walk" id="walk-left">⟲ Left</button>
      <button class="btn btn-walk" id="walk-back">◀ Back</button>
      <button class="btn btn-walk" id="walk-stop">■ Stop</button>
      <button class="btn btn-walk" id="walk-fwd">Fwd ▶</button>
      <button class="btn btn-walk" id="walk-right">Right ⟳</button>
      <span id="walk-status" class="walk-status">idle</span>
    </div>

    <!-- Gait tuning -->
    <div class="ctl-group gait-sliders">
      <label>cycle <span id="g-cycle-val">1.20</span>s
        <input type="range" id="g-cycle" min="0.4" max="3.0" step="0.05" value="1.2"></label>
    </div>

    <!-- Gait path -->
    <div class="ctl-group gait-path-group">
      <span class="ctl-label">Gait Path <span class="hint">(click a quadrant to add a point)</span></span>
      <div class="gait-path-buttons">
        <button class="btn" id="gp-record">● Record</button>
        <button class="btn" id="gp-undo">Undo</button>
        <button class="btn" id="gp-clear">Clear</button>
        <button class="btn" id="gp-save">Save Path</button>
      </div>
    </div>

    <!-- Jump -->
    <div class="ctl-group gait-path-group">
      <span class="ctl-label">Jump <span class="hint">(pick a point, click a quadrant to place it; J to jump)</span></span>
      <div class="gait-path-buttons">
        <button class="btn btn-jp" id="jp-neutral" data-key="neutral">Neutral</button>
        <button class="btn btn-jp" id="jp-crouch"  data-key="crouch">Crouch</button>
        <button class="btn btn-jp" id="jp-extend"  data-key="extend">Extend</button>
        <button class="btn" id="jp-save">Save Points</button>
        <button class="btn" id="jp-go">⤒ Jump</button>
        <span id="jp-readout" class="walk-status"></span>
      </div>
    </div>
  </div>

  <main>
    <div id="stage">
      <canvas id="canvas"></canvas>
    </div>
    <div id="gait-path-list" class="gait-path-list"></div>
    <div id="readout" class="coords-box"></div>
  </main>

  <script src="/static/config.js"></script>
  <script src="/static/renderer.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
