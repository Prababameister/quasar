<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkage Test Utility</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Linkage Test Utility</h1>
    <div class="header-controls">
      <span id="status-msg" class="status-msg"></span>
      <button id="btn-reload" class="btn">↺ Reload Config</button>
    </div>
  </header>

  <main>
    <!-- ── Left panel: FK viewer with sliders ── -->
    <section class="panel" id="panel-fk">
      <h2>Forward Kinematics</h2>
      <canvas id="canvas-fk"></canvas>
      <div id="sliders"></div>
      <div id="coords-fk" class="coords-box"></div>
    </section>

    <!-- ── Right panel: IK click target ── -->
    <section class="panel" id="panel-ik">
      <h2>Inverse Kinematics <span class="hint">(click to set target)</span></h2>
      <canvas id="canvas-ik"></canvas>
      <div id="ik-status" class="ik-status"></div>
      <div id="coords-ik" class="coords-box"></div>
    </section>
  </main>

  <script src="/static/config.js"></script>
  <script src="/static/renderer.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
